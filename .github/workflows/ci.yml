name: CI

# Branches are tested once through their pull request; main is tested after
# each merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend SQL tests (PGlite)
        run: npm ci && node tool/db_test.mjs
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code (must be committed and current)
        run: |
          dart run build_runner build
          git diff --exit-code
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
